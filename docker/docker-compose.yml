# =============================================================================
#  AI Blue Team Bootcamp - lab stack
#  Run from the repo root so the shared .env is picked up:
#     docker compose --env-file .env -f docker/docker-compose.yml --profile core up -d
#
#  Profiles (bring up only what a module needs):
#     core    : mock-ollama + ai-soc-assistant           (Modules 1,3,4,5)
#     targets : victim-web + victim-ssh                   (Module 2,5)
#     attack  : attacker toolbox                          (Module 2,4,5)
#     logs    : synthetic log generator                   (Module 1,2)
#
#  Bring up everything:  ... --profile core --profile targets --profile attack --profile logs up -d
# =============================================================================
name: soclab

networks:
  soclab:
    driver: bridge

services:
  mock-ollama:
    build: ./mock-ollama
    profiles: ["core"]
    networks: ["soclab"]
    ports:
      - "${MOCK_OLLAMA_PORT:-11435}:11434"
    restart: unless-stopped

  ai-soc-assistant:
    build: ./ai-soc-assistant
    profiles: ["core"]
    networks: ["soclab"]
    ports:
      - "${AI_SOC_PORT:-8080}:8080"
    environment:
      # The assistant has its OWN model endpoint, separate from the host-side OLLAMA_HOST,
      # so the offline path can point host scripts at localhost:11435 while the assistant
      # still reaches the mock over the docker network. Default = the deterministic mock,
      # which keeps the Module 4 attack/defense demo reliable. To make the assistant use the
      # real GPU, set AI_SOC_OLLAMA_HOST=http://10.50.142.235:11434 in .env.
      OLLAMA_HOST: "${AI_SOC_OLLAMA_HOST:-http://mock-ollama:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.1:8b}"
      AI_SOC_MODE: "${AI_SOC_MODE:-vulnerable}"
    depends_on:
      - mock-ollama
    restart: unless-stopped

  victim-web:
    build: ./victim-web
    profiles: ["targets"]
    networks: ["soclab"]
    ports:
      - "${VICTIM_WEB_PORT:-8081}:8081"
    restart: unless-stopped

  victim-ssh:
    image: lscr.io/linuxserver/openssh-server:latest
    profiles: ["targets"]
    networks: ["soclab"]
    ports:
      - "${VICTIM_SSH_PORT:-2222}:2222"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
      USER_NAME: "labuser"
      # Weak password on purpose - it's in the brute-force wordlist so the attack succeeds.
      USER_PASSWORD: "Password1"
      PASSWORD_ACCESS: "true"
    restart: unless-stopped

  attacker:
    build: ./attacker
    profiles: ["attack"]
    networks: ["soclab"]
    # Stays alive; students `docker exec -it soclab-attacker-1 bash`
    restart: unless-stopped

  log-generator:
    build: ./log-generator
    profiles: ["logs"]
    networks: ["soclab"]
    environment:
      OUTPUT_DIR: "/out"
      LOOP: "${LOG_LOOP:-0}"
    volumes:
      # Generated logs land in datasets/generated/ on the host for students to read.
      - ../datasets/generated:/out
    restart: "no"
